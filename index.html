  sh.forEach((row,y)=>[...row].forEach((ch,i)=>{if(ch==='.')return;x.fillStyle=ch==='H'?h:o;x.fillRect(i,y,1,1);}));
  petalSprites.push(c);}
let petals=[],petalBurst=false,nextPetal=0;
function makePetal(x,y,burst){
  const a=Math.random()*6.283,sp=burst?(380+Math.random()*520):0;
  return {x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*.75-(burst?40:0),img:petalSprites[Math.random()*petalSprites.length|0],
    ph:Math.random()*6.283,fr:1.2+Math.random()*1.6,sw:10+Math.random()*16,flip:2+Math.random()*3,
    rot:Math.random()*6.283,vr:(Math.random()-.5)*3,term:22+Math.random()*18,life:0,sc:3};}
function updatePetals(dt){
  if(!petalBurst&&time>=T_FIN){petalBurst=true;const n=40+(Math.random()*30|0);for(let i=0;i<n;i++)petals.push(makePetal(ox+CX,oy+CY+sc,true));nextPetal=1.5;}
  ctx.imageSmoothingEnabled=false;
  for(let i=petals.length-1;i>=0;i--){const p=petals[i];p.life+=dt;
    const drag=Math.exp(-2.4*dt);p.vx*=drag;p.vy*=drag;           // air drag kills burst force
    p.vy+=22*dt; if(p.vy>p.term)p.vy+=(p.term-p.vy)*(1-Math.exp(-3*dt)); // low gravity, small terminal velocity
    {const im=pushAt(p.x,p.y-sc,PXs,PYs,2.6,140,dt);if(im){p.vx+=im[0];p.vy+=im[1];}} // keeps momentum; drag restores drift
    const sway=Math.sin(p.ph+p.life*p.fr)*p.sw;                   // feather flutter
    p.x+=(p.vx+sway)*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    const fade=clamp((pageH-p.y)/(H*.4));if(p.y>pageH+10||fade<=0){petals.splice(i,1);continue;}
    const sy=p.y-sc;if(sy<-20||sy>H+20)continue; // off-screen: keep simulating, skip drawing
    const fl=Math.cos(p.life*p.flip+p.ph);                         // flip (scaleX oscillation)
    ctx.save();ctx.globalAlpha=fade*clamp(p.life/.08);ctx.translate(Math.round(p.x),Math.round(sy));ctx.rotate(Math.round(p.rot/(Math.PI/4))*(Math.PI/4)+Math.sin(p.life*p.fr)*.3);
    ctx.scale((Math.abs(fl)<.2?.2*Math.sign(fl||1):fl)*p.sc,p.sc);ctx.drawImage(p.img,-p.img.width/2|0,-p.img.height/2|0);ctx.restore();}
}
function spawnShoot(){
  const fromLeft=Math.random()<.5,sp=140+Math.random()*120;
  const ang=(fromLeft?0:Math.PI)+(fromLeft?1:-1)*(.25+Math.random()*.35);
  shoot.push({x:fromLeft?-10:W+10,y:Math.random()*(pageH),vx:Math.cos(ang)*sp,vy:Math.abs(Math.sin(ang))*sp,life:0,max:1.2+Math.random()*.8,trail:[]});
}
function frame(ts){
  if(last===null)last=ts;let dt=(ts-last)/1000;last=ts;dt=Math.min(Math.max(dt,0),1/20);
  if(!ready){requestAnimationFrame(frame);return;}
  time+=dt;
  updatePointer(dt);PXs=ptr.cx/PX;PYs=ptr.cy/PX;
  sc=scrollY/PX; oy=baseOy-Math.round(sc); if(scrollY>20)scrolled=true;
  {const on=(time>T_FIN+1&&!scrolled&&scrollY<20);if(on!==hintOn){hintOn=on;hintEl.style.opacity=on?'0.85':'0';}}
  ctx.globalAlpha=1;ctx.fillStyle='#07060d';ctx.fillRect(0,0,W,H);
  for(const s of stars){
    s.x-=s.v*dt;if(s.x<0)s.x+=W;
    {const hy=(((s.y-sc*.35)%H)+H)%H;s.ox=s.ox||0;s.oy=s.oy||0;s.ovx=s.ovx||0;s.ovy=s.ovy||0;
     const im=pushAt(s.x+s.ox,hy+s.oy,PXs,PYs,2.2,90,dt);if(im){s.ovx+=im[0];s.ovy+=im[1];}
     if(time>=T_FIN&&!s.hit){ // shockwave ring from logo centre: nearer stars get hit first
       const dx=s.x-(ox+CX),dy=hy-(oy+CY),d=Math.hypot(dx,dy),r=(time-T_FIN)*520/PX*1.5;
       if(d<=r){s.hit=1;const RM=Math.max(W,H)*.8,f=Math.max(0,1-d/RM)**1.5,inv=d>0?1/d:0;s.ovx+=dx*inv*230*f;s.ovy+=dy*inv*230*f;}}
     const K=38,C=7.5;s.ovx+=(-K*s.ox-C*s.ovx)*dt;s.ovy+=(-K*s.oy-C*s.ovy)*dt; // spring home, damped
     s.ox+=s.ovx*dt;s.oy+=s.ovy*dt;const m=Math.hypot(s.ox,s.oy),M=18/PX;if(m>M){s.ox*=M/m;s.oy*=M/m;}}
    const b=.5+.5*Math.sin(s.p+time*s.s);ctx.fillStyle=STARC[(b*31)|0];
    const x=(s.x+s.ox)|0,y=((((s.y-sc*.35)%H)+H)%H+s.oy)|0,ss=PX<2?2:1;ctx.fillRect(x,y,ss,ss);
    if(s.big&&b>.7){ctx.fillStyle=`rgba(150,160,220,${(b-.5)*1.5})`;ctx.fillRect(x-1,y,1,1);ctx.fillRect(x+1,y,1,1);ctx.fillRect(x,y-1,1,1);ctx.fillRect(x,y+1,1,1);}
  }
  nextShoot-=dt;if(nextShoot<=0){spawnShoot();nextShoot=.8+Math.random()*1.6;}
  for(let i=shoot.length-1;i>=0;i--){const s=shoot[i];s.life+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.trail.push([s.x,s.y]);if(s.trail.length>40)s.trail.shift();
    const fade=Math.min(1,(s.max-s.life)/.4);
    for(let k=0;k<s.trail.length;k++){const a=(k/s.trail.length)*fade;ctx.fillStyle=k>s.trail.length-3?`rgba(255,255,255,${a})`:`rgba(200,215,255,${a})`;ctx.fillRect(Math.round(s.trail[k][0]),Math.round(s.trail[k][1]-sc),1,1);}
    if(s.life>s.max||s.x<-50||s.x>W+50||s.y>pageH+50)shoot.splice(i,1);}
  const cx=ox+CX,cy=oy+CY,R=Math.max(W,H)*.75;
  // 1) letters fly in
  if(time<T_LET+.05){const prog=time/T_LET;
    for(const p of chunks){let t=(prog-p.delay)/(1-.5);t=clamp(t);if(t===0)continue;
      const tx=ox+p.x,ty=oy+p.y,fx=cx+p.sx*R,fy=cy+p.sy*R;
      const pos=u=>{const e=easeOutQuint(u),sw=Math.sin(e*Math.PI)*p.sw*R*.4;return[fx+(tx-fx)*e-p.sy*sw,fy+(ty-fy)*e+p.sx*sw];};
      const blit=(q)=>{const X=Math.round(q[0]),Y=Math.round(q[1]);for(const [dx,dy,c] of p.px){ctx.fillStyle=c;ctx.fillRect(X+dx,Y+dy,1,1);}};
      if(t<1){for(let k=2;k>=1;k--){ctx.globalAlpha=.2*(3-k)*Math.min(1,t*3);blit(pos(Math.max(0,t-k*.04)));}}
      ctx.globalAlpha=Math.min(1,.2+t*1.4);blit(pos(t));}
    ctx.globalAlpha=1;}
  // built layers
  if(time>=T_LET){
    const fin=time>=T_FIN+.2;
    const src=fin?full:(buildLogo(),logoC);
    const ramp=clamp((time-T_FIN)/.8),pulse=.55+.45*Math.sin(time*2.2),base=.35;
    if(oy+lh+GM>0&&oy-GM<H){ // skip when scrolled away
    if(!glowC)makeGlow();
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(1,(fin?1:clamp((time-T_LET)/1.5))*(base+(.4*pulse)*ramp)*1.6);
    ctx.drawImage(glowC,ox-GM,oy-GM);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    ctx.drawImage(src,ox,oy);}
  }
  // small flash when letters lock in
  const f1=time-T_FLASH1;if(f1>=0&&f1<.5){const f=1-easeOutCubic(f1/.5);radialFlash(cx,cy,lh*.9*(.6+f1),f*.55,1);}
  // 2) spark heads leading the frame lines
  const u=edgeU();if(time>=T_EDGE&&time<T_EDGE+D_EDGE+.15){
    const hs=headPos(u),fade=clamp((T_EDGE+D_EDGE+.15-time)/.15);
    for(const [hx,hy] of hs){const X=Math.round(ox+hx),Y=Math.round(oy+hy);
      ctx.globalAlpha=fade;ctx.drawImage(sparkG,X-12,Y-12);
      ctx.fillStyle='#fff6de';ctx.fillRect(X-2,Y-2,4,4);ctx.fillStyle='#ffb43c';ctx.fillRect(X-3,Y-1,6,2);ctx.fillRect(X-1,Y-3,2,6);
      // ember sparks thrown off the head
      for(let k=0;k<3;k++){const a=Math.random()*6.28,r=Math.random()*7;ctx.globalAlpha=fade*.8;ctx.fillStyle=k?'#ff9a2a':'#ffe7b0';ctx.fillRect(Math.round(X+Math.cos(a)*r),Math.round(Y+Math.sin(a)*r),1,1);}
      ctx.globalAlpha=1;}}
  // rosette burst rings
  if(tCorner!==null){const a=time-tCorner;if(a>=0&&a<.5){const f=1-a/.5;ctx.fillStyle=`rgba(255,220,150,${f})`;
    for(const [qx,qy] of CORN)for(let k=0;k<16;k++){const an=k/16*6.283+a*3,r=4+a*44;ctx.fillRect(Math.round(ox+qx+Math.cos(an)*r),Math.round(oy+qy+Math.sin(an)*r),2,2);}}}
  // 4) final flash
  const f2=time-T_FIN;if(f2>=0&&f2<.8){const f=1-easeInOut(f2/.8);radialFlash(cx,cy,Math.min(W,H)*.5*(.5+f2*.7),f,1);
    ctx.globalAlpha=f;ctx.fillStyle='#fff';for(let k=0;k<48;k++){const a=k/48*6.283,r=f2*lw*.8*(0.7+0.3*((k*37)%10)/10);ctx.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r*.5),2,2);}ctx.globalAlpha=1;}
  updatePetals(dt);
  for(const h of (window.FFC_HOOKS||[]))h(dt);
  requestAnimationFrame(frame);
}
})();
